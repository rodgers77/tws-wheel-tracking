<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TWS Live Board</title>
<style>
body{margin:0;font-family:system-ui,Arial,sans-serif;background:#111;color:#fff}
header{background:#e30613;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header b{font-size:24px;flex:1}#q{font-size:20px;padding:10px;border-radius:8px;border:0;min-width:0;flex:1 1 220px}
small,.dim{color:#aaa}main{padding:10px 16px}
.job{display:grid;grid-template-columns:2fr 1.4fr auto;gap:12px;align-items:center;background:#222;border-radius:12px;padding:14px 18px;margin:10px 0;border-left:10px solid #0a5}
.job.hold{border-left-color:#ffd400;background:#3a3000}.cust{font-size:26px;font-weight:800}.meta{font-size:18px;color:#ccc}
.st{font-size:40px;font-weight:900;line-height:1}.st.wait{font-size:26px;color:#ccc}.ago{font-size:18px;color:#aaa}.tag{background:#ffd400;color:#000;font-weight:900;padding:2px 10px;border-radius:6px;font-size:22px}
.job>div{min-width:0}.records{grid-column:1/-1;min-width:0;overflow-wrap:anywhere;border-top:1px solid #444;padding-top:10px}.records h3{font-size:18px;margin:4px 0 8px}.record-group{margin:10px 0}.record-group ul{margin:4px 0;padding-left:22px}.record-group li{padding:3px 0}
.rank-label{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:16px}.rank-label input{width:85px;max-width:100%;font-size:18px;padding:8px;border-radius:6px;border:0}
.controls{display:flex;gap:6px;flex-wrap:wrap}.rush{background:#ffd400;color:#111;font-weight:800;padding:2px 6px;border-radius:4px}.job .del{background:#7a0000;margin-left:6px}
.job button{font-size:16px;padding:8px 12px;border:0;border-radius:8px;background:#444;color:#fff}
h2{font-size:20px;color:#aaa;margin:24px 0 6px}
.history{margin:10px 16px;background:#222;padding:12px;border-radius:10px;overflow-wrap:anywhere}.history summary{cursor:pointer;font-size:20px;font-weight:700}.entry{padding:8px 0;border-bottom:1px solid #444}.entry.alert{border-left:5px solid #b00;padding-left:8px}.entry.complete{border-left-color:#0a5}.time{color:#aaa;font-size:14px}
#err{background:#b00;padding:8px 16px;display:none;font-weight:700}
#dl{font-size:14px;padding:6px 10px;border:0;border-radius:6px;background:#333;color:#fff}
.thumb{width:120px;height:120px;object-fit:cover;border-radius:8px;background:#000;float:left;margin:0 12px 6px 0}.nothumb{width:120px;height:120px;float:left;margin:0 12px 6px 0;display:flex;align-items:center;justify-content:center;border:2px dashed #777;border-radius:8px;color:#bbb;font-size:14px;text-align:center}
.colour{display:inline-block;background:#ffd400;color:#000;font-weight:900;border-radius:6px;padding:2px 10px;font-size:20px;margin:4px 0}.who{color:#ccc}
header a{color:#fff;font-weight:700;font-size:18px}
@media(max-width:700px){header b{font-size:20px;flex-basis:100%}#q{flex-basis:100%}.job{grid-template-columns:1fr;gap:4px}.st{font-size:34px}.cust{font-size:22px}}
</style></head><body>
<header><b>TWS Live Board</b><a href="history.html" id="histlink">Job history &amp; search</a><input id="q" placeholder="Search customer / reg / part / colour" aria-label="Search"></header>
<div id="err"></div><main id="m"><p class="dim">Loading...</p></main>
<details class="history" id="office-alerts" open><summary>Office alerts</summary><div id="alerts"><p class="dim">Loading...</p></div></details>
<details class="history" id="office-log"><summary>Scan log</summary><p class="dim">Retained app entries, newest first. Download log (CSV) for the full stored event history.</p><div id="log"><p class="dim">Loading...</p></div></details>
<footer style="padding:10px 16px" class="dim">Updates every 5 s · <span id="upd"></span> · <button id="dl">Download log (CSV)</button> <span id="ds"></span></footer>
<script src="logic.js"></script>
<script>
const API=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)?'http://127.0.0.1:8787':'https://tws-wheel-tracking-api.tws-workshop.workers.dev'; // local test Worker when opened locally
const {S,step}=TWS, esc=s=>String(s??'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
let DB=null,V=0;const pin=()=>localStorage.pin||(localStorage.pin=prompt('Workshop PIN')||''); // remembered on this computer
async function call(path,opt={}){if(path==='/action'&&opt.body)opt={...opt,body:JSON.stringify({...JSON.parse(opt.body),schema:TWS.SCHEMA})};const r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json','X-PIN':pin()}});
 if(r.status==401){localStorage.pin='';throw new Error('Wrong workshop PIN - reload and re-enter');}if(!r.ok){let m='';try{m=(await r.clone().json()).error}catch{}throw new Error(m||'Server error '+r.status);};return r;}
const err=m=>{const e=document.getElementById('err');e.style.display=m?'block':'none';e.textContent=m?'Not connected: '+m:'';};
const ago=t=>{if(!t)return '';const m=Math.floor((Date.now()-new Date(t))/60000);return m<1?'just now':m<60?m+' min ago':Math.floor(m/60)+' h '+(m%60)+' min ago';};
const day=t=>new Date(t).toLocaleDateString('en-GB',{timeZone:'Europe/London'});
const name=id=>(S.find(s=>s.id==id)||{name:id}).name.replace(/^\d+\s*/,'');
const ukTime=t=>{const d=new Date(t);return Number.isNaN(d.getTime())?'Unknown time':d.toLocaleString('en-GB',{timeZone:'Europe/London'})+' UK';};
function drawHistory(){
 document.getElementById('alerts').innerHTML=DB.alerts.slice().reverse().map(a=>`<div class="entry alert${/^Job complete/.test(a.msg)?' complete':''}">${esc(a.msg)}<div class="time">${esc(ukTime(a.t))}</div></div>`).join('')||'<p class="dim">No office alerts.</p>';
 document.getElementById('log').innerHTML=DB.log.slice().reverse().map(r=>`<div class="entry">${esc(r.station)} · ${esc(r.job)} · ${esc(r.what)}${r.name?' · '+esc(r.name):''}<div class="time">${esc(ukTime(r.t))}</div></div>`).join('')||'<p class="dim">No scans recorded.</p>';
}
// Who + when beside every tick line: time only for today, date and time for older entries (full date-time on hover).
const whenShort=t=>{const d=new Date(t);if(Number.isNaN(d.getTime()))return 'time not recorded';const o={timeZone:'Europe/London'};
 return (day(d)===day(Date.now())?'':d.toLocaleDateString('en-GB',o)+' ')+d.toLocaleTimeString('en-GB',{...o,hour:'2-digit',minute:'2-digit'});};
const byWho=t=>t.item==='batch time'?'':` <span class="who" title="${esc(t.t?ukTime(t.t):'')}">— ${esc(t.name||'Name not recorded')}, ${esc(whenShort(t.t))}</span>`;
const PHOTOS={};
function photoTag(j){if(!TWS.photoId(j.photo))return '<div class="nothumb">No photo</div>';const id=j.photo;
 if(!PHOTOS[id]){PHOTOS[id]='loading';call('/photo/'+id).then(r=>r.blob()).then(b=>{PHOTOS[id]=URL.createObjectURL(b);document.querySelectorAll(`img[data-photo="${id}"]`).forEach(i=>i.src=PHOTOS[id]);}).catch(()=>{delete PHOTOS[id];});}
 return `<img class="thumb" data-photo="${id}" alt="Front of wheel" ${PHOTOS[id]!=='loading'?'src="'+PHOTOS[id]+'"':''}>`;}
function recordedChecklist(j,finished=true){
 const ticks=Array.isArray(j.ticks)?j.ticks:[];
 if(!ticks.length)return `<section class="records" aria-label="Recorded checklist"><p class="dim">${finished?'No checklist records available.':'No ticks recorded yet.'}</p></section>`;
 const groups=[];for(const tick of ticks){const previous=groups[groups.length-1];
  if(previous&&previous.st===tick.st&&previous.t===tick.t&&previous.name===tick.name)previous.ticks.push(tick);
  else groups.push({st:tick.st,t:tick.t,name:tick.name,ticks:[tick]});}
 const visits=Object.create(null);return `<section class="records" aria-label="Recorded checklist"><h3>${finished?'Recorded checklist':'Recorded so far'}</h3>`+groups.map(g=>{
  visits[g.st]=(visits[g.st]||0)+1;const station=esc(name(g.st||'')||'Station not recorded');
  const when=g.t||((g.ticks.length===1&&g.ticks[0].item==='batch time')?g.ticks[0].value:'');
  return `<div class="record-group"><b>${station}${visits[g.st]>1?' · recorded group '+visits[g.st]:''}</b><div class="time">${when?esc(ukTime(when)):'Time not recorded'}</div><ul>`+g.ticks.map(t=>{
   if(Object.prototype.hasOwnProperty.call(t,'value')){const value=t.value===null||String(t.value).trim()===''?'Value not recorded':t.item==='batch time'?ukTime(t.value):String(t.value);return `<li>${esc(t.item==='batch time'?'Oven batch started':t.item)}: <b>${esc(value)}</b>${byWho(t)}</li>`;}
   return `<li><span aria-label="Recorded tick">✓</span> ${esc(t.item)}${byWho(t)}</li>`;
  }).join('')+'</ul></div>';
 }).join('')+'</section>';
}
function jobCard(j,i,last,finished=false){return `<div class="job${!finished&&j.hold?' hold':''}"><div>${photoTag(j)}<div class="cust">${esc(j.cust)} ${!finished&&j.rush===true?'<span class="rush">RUSH</span>':''}</div><div class="colour">${esc(TWS.colour(j))}</div><div class="meta">${esc(j.make)} · ${esc(j.reg||'no reg')} · <b>${esc(j.part)}</b> (last 4: ${esc(TWS.last4(j.part))}) · ${esc(j.n)} wheels${j.tyre?' · Wheel size '+esc(TWS.wheelSize(j.tyre)):''}${j.inserts==='Yes'?' · Inserts':''}</div></div>
 <div><div class="st${!finished&&!TWS.where(j).at?' wait':''}">${finished?'Finished':esc(TWS.where(j).text)}</div><div class="ago">${finished?'Completed '+esc(new Date(last(j)).toLocaleTimeString('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit'}))+' UK':(j.hold?'<span class="tag">ON HOLD</span> ':'')+'last scan '+ago(last(j))}</div></div>
 ${finished?'':`<div class="controls"><label class="rank-label">Priority number<input type="number" min="1" step="1" data-rank-input="${i}" value="${esc(j.priorityNumber??'')}" aria-label="Priority number for ${esc(j.part)}"></label><button data-rank="${i}">Save priority</button><button data-rank-clear="${i}">Clear priority</button><button aria-pressed="${j.rush===true}" data-priority="${i}">${j.rush===true?'Return to normal':'Set rush'}</button><button data-hold="${i}">${j.hold?'Release':'Hold'}</button><button class="del" data-del="${i}">Delete</button></div>`}${recordedChecklist(j,finished)}</div>`;}
function draw(){if(!DB)return;drawHistory();const q=document.getElementById('q').value.trim().toLowerCase();
 const last=j=>{ // own records are authoritative; never borrow another booking's same-part history
  if(j.done){const times=(j.ticks||[]).map(t=>t.t||(t.item==='batch time'?t.value:'')).filter(t=>t&&!Number.isNaN(new Date(t).getTime()));if(times.length)return times[times.length-1];
   if(DB.jobs.some(other=>other!==j&&other.part===j.part))return;}
  const next=DB.jobs.filter(other=>other!==j&&other.part===j.part&&other.booked>j.booked).map(other=>other.booked).sort()[0];
  for(let i=DB.log.length-1;i>=0;i--){const r=DB.log[i];if(r.job===j.part&&(!j.booked||r.t>=j.booked)&&(!next||r.t<next))return r.t;}};
 const hit=j=>!q||[j.cust,j.reg,j.part,j.colour,TWS.last4(j.part),j.job].some(v=>String(v||'').toLowerCase().includes(q));
 const open=DB.jobs.map((j,i)=>({j,i})).filter(x=>!x.j.done&&hit(x.j)).sort((a,b)=>TWS.compare(a.j,b.j));
 const done=DB.jobs.filter(j=>j.done&&hit(j)&&last(j)&&day(last(j))==day(Date.now()));
 document.getElementById('m').innerHTML=(open.map(({j,i})=>jobCard(j,i,last)).join('')||'<p class="dim">No open jobs'+(q?' match':'')+'.</p>')
  +`<h2>Completed today (${done.length})</h2>`+(done.map(j=>jobCard(j,null,last,true)).join('')||'<p class="dim">None yet.</p>');
 document.querySelectorAll('[data-hold]').forEach(b=>b.onclick=async()=>{const j=DB.jobs[b.dataset.hold];try{const d=await (await call('/action',{method:'POST',body:JSON.stringify({type:'hold',st:'office',dev:'office-board',part:j.part,hold:!j.hold})})).json();DB=d.db;V=d.v;draw();}catch(e){err(e.message);}});
 document.querySelectorAll('[data-rank], [data-rank-clear]').forEach(b=>b.onclick=async()=>{const i=b.dataset.rank??b.dataset.rankClear,j=DB.jobs[i],input=document.querySelector(`[data-rank-input="${i}"]`),text=b.hasAttribute('data-rank-clear')?'':input.value.trim();
  if(text&&(!/^[0-9]+$/.test(text)||!Number.isSafeInteger(Number(text))||Number(text)<=0)){err('Priority number must be a positive whole number.');return;}
  let error='';try{await call('/action',{method:'POST',body:JSON.stringify({type:'rank',st:'office',dev:'office-board',part:j.part,booked:j.booked,v:V,priorityNumber:text?Number(text):null})});}catch(e){error=e.message;}
  await pull(true);if(error)err(error);});
 document.querySelectorAll('[data-priority]').forEach(b=>b.onclick=async()=>{const j=DB.jobs[b.dataset.priority];b.disabled=true;
  let error='';try{await call('/action',{method:'POST',body:JSON.stringify({type:'priority',st:'office',dev:'office-board',part:j.part,booked:j.booked,v:V,rush:j.rush!==true})});}catch(e){error=e.message;}
  await pull();if(error)err(error);});
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{const j=DB.jobs[b.dataset.del];
  if(!confirm(`Delete this job for good?\n\n${j.cust} · ${j.make} · ${j.reg||'no reg'}\nPart ${j.part} · job ${j.job||'-'} · ${j.n} wheels\nStatus: ${TWS.where(j).text}\n\nThe scan log is kept. This cannot be undone.`))return;
  try{await call('/action',{method:'POST',body:JSON.stringify({type:'delete',st:'office',dev:'office-board',part:j.part,booked:j.booked,v:V})});err('');}catch(e){err(e.message);}await pull();});}
async function pull(force=false){if(!force&&document.activeElement?.matches('[data-rank-input]'))return;try{const d=await (await call('/state')).json();DB=d.db;V=d.v;err('');document.getElementById('upd').textContent='updated '+new Date().toLocaleTimeString('en-GB',{timeZone:'Europe/London'});draw();}catch(e){err(e.message);}}
document.getElementById('q').oninput=draw;pull();setInterval(pull,5000);
document.getElementById('dl').onclick=async()=>{const ds=document.getElementById('ds');
 try{const r=await call('/export.csv');const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());
  a.download='tws-wheel-log-'+new Date().toLocaleDateString('en-CA',{timeZone:'Europe/London'})+'.csv';a.click();ds.textContent='Downloaded.';}catch(e){ds.textContent='Download failed: '+e.message;}};
</script></body></html>
