<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TWS Live Board</title>
<style>
body{margin:0;font-family:system-ui,Arial,sans-serif;background:#111;color:#fff}
header{background:#e30613;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header b{font-size:24px;flex:1}#q{font-size:20px;padding:10px;border-radius:8px;border:0;min-width:0;flex:1 1 220px}
small,.dim{color:#aaa}main{padding:10px 16px}
.job{display:grid;grid-template-columns:2fr 1.4fr auto;gap:12px;align-items:center;background:#222;border-radius:12px;padding:14px 18px;margin:10px 0;border-left:10px solid #0a5}
.job.hold{border-left-color:#ffd400;background:#3a3000}.cust{font-size:26px;font-weight:800}.meta{font-size:18px;color:#ccc}
.st{font-size:40px;font-weight:900;line-height:1}.ago{font-size:18px;color:#aaa}.tag{background:#ffd400;color:#000;font-weight:900;padding:2px 10px;border-radius:6px;font-size:22px}
.job button{font-size:16px;padding:8px 12px;border:0;border-radius:8px;background:#444;color:#fff}
h2{font-size:20px;color:#aaa;margin:24px 0 6px}.done{font-size:18px;padding:8px 0;border-bottom:1px solid #333}
#err{background:#b00;padding:8px 16px;display:none;font-weight:700}
#dl{font-size:14px;padding:6px 10px;border:0;border-radius:6px;background:#333;color:#fff}
@media(max-width:700px){header b{font-size:20px;flex-basis:100%}#q{flex-basis:100%}.job{grid-template-columns:1fr;gap:4px}.st{font-size:34px}.cust{font-size:22px}}
</style></head><body>
<header><b>TWS Live Board</b><input id="q" placeholder="Search customer / reg / part" aria-label="Search"></header>
<div id="err"></div><main id="m"><p class="dim">Loading...</p></main>
<footer style="padding:10px 16px" class="dim">Updates every 5 s · <span id="upd"></span> · <button id="dl">Download log (CSV)</button> <span id="ds"></span> · <a href="index.html#office" style="color:#aaa">Alerts &amp; full log</a></footer>
<script src="logic.js"></script>
<script>
const API='https://tws-wheel-tracking-api.tws-workshop.workers.dev';
const {S,step}=TWS, esc=s=>String(s??'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
let DB=null;const pin=()=>localStorage.pin||(localStorage.pin=prompt('Workshop PIN')||''); // remembered on this computer
async function call(path,opt={}){const r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json','X-PIN':pin()}});
 if(r.status==401){localStorage.pin='';throw new Error('Wrong workshop PIN - reload and re-enter');}if(!r.ok)throw new Error('Server error '+r.status);return r;}
const err=m=>{const e=document.getElementById('err');e.style.display=m?'block':'none';e.textContent=m?'Not connected: '+m:'';};
const ago=t=>{if(!t)return '';const m=Math.floor((Date.now()-new Date(t))/60000);return m<1?'just now':m<60?m+' min ago':Math.floor(m/60)+' h '+(m%60)+' min ago';};
const day=t=>new Date(t).toLocaleDateString('en-GB',{timeZone:'Europe/London'});
const name=id=>(S.find(s=>s.id==id)||{name:id}).name.replace(/^\d+\s*/,'');
function draw(){if(!DB)return;const q=document.getElementById('q').value.trim().toLowerCase();
 const last=p=>{for(let i=DB.log.length-1;i>=0;i--)if(DB.log[i].job==p)return DB.log[i].t;};
 const hit=j=>!q||[j.cust,j.reg,j.part].some(v=>String(v||'').toLowerCase().includes(q));
 const open=DB.jobs.map((j,i)=>({j,i})).filter(x=>!x.j.done&&hit(x.j)).sort((a,b)=>a.j.booked<b.j.booked?-1:1);
 const done=DB.jobs.filter(j=>j.done&&hit(j)&&last(j.part)&&day(last(j.part))==day(Date.now()));
 document.getElementById('m').innerHTML=(open.map(({j,i})=>`<div class="job${j.hold?' hold':''}"><div><div class="cust">${esc(j.cust)}</div><div class="meta">${esc(j.make)} · ${esc(j.reg||'no reg')} · <b>${esc(j.part)}</b> · ${j.n} wheels</div></div>
  <div><div class="st">${esc(name(step(j)))}${j.inBatch?' <small>(loading)</small>':''}</div><div class="ago">${j.hold?'<span class="tag">ON HOLD</span> ':''}last scan ${ago(last(j.part))}</div></div>
  <button data-hold="${i}">${j.hold?'Release':'Hold'}</button></div>`).join('')||'<p class="dim">No open jobs'+(q?' match':'')+'.</p>')
  +`<h2>Completed today (${done.length})</h2>`+(done.map(j=>`<div class="done">${esc(j.cust)} · ${esc(j.make)} · ${esc(j.reg)} · ${esc(j.part)} · ${j.n} wheels <span class="dim">done ${new Date(last(j.part)).toLocaleTimeString('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit'})}</span></div>`).join('')||'<p class="dim">None yet.</p>');
 document.querySelectorAll('[data-hold]').forEach(b=>b.onclick=async()=>{const j=DB.jobs[b.dataset.hold];try{DB=(await (await call('/action',{method:'POST',body:JSON.stringify({type:'hold',st:'office',dev:'office-board',part:j.part,hold:!j.hold})})).json()).db;draw();}catch(e){err(e.message);}});}
async function pull(){try{DB=(await (await call('/state')).json()).db;err('');document.getElementById('upd').textContent='updated '+new Date().toLocaleTimeString('en-GB',{timeZone:'Europe/London'});draw();}catch(e){err(e.message);}}
document.getElementById('q').oninput=draw;pull();setInterval(pull,5000);
document.getElementById('dl').onclick=async()=>{const ds=document.getElementById('ds');
 try{const r=await call('/export.csv');const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());
  a.download='tws-wheel-log-'+new Date().toLocaleDateString('en-CA',{timeZone:'Europe/London'})+'.csv';a.click();ds.textContent='Downloaded.';}catch(e){ds.textContent='Download failed: '+e.message;}};
</script></body></html>
